# Execution parameters for the local `python -m poc benchmark` CLI, which runs the official
# Evidence-Grounded Investigation Prompt. Prompts and the evidence validator are fixed in code
# (src/poc/official_prompt.py, src/poc/validators.py) and are not configurable.
model: claude-sonnet-5
max_tokens: 8192
# temperature is intentionally omitted (the model rejects it).
